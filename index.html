<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>セントラルホテルグループQ&Aチャット</title>

<style>

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}


#bg-layer {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  background: #ffffff;
  z-index: 0;
  pointer-events: none; 
}

.site-header {
  background: #4376DF;
  color: #fff;
  padding: 16px;
}

.site-main {
  padding: 16px;
  line-height: 1.8;
}

.site-footer {
  padding: 16px;
  background: #f0f0f0;
  font-size: 12px;
}


#chat-layer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(4px);
}



#chatbox {
  width: 360px;
  max-width: 95vw;
  height: 520px;
  max-height: 75dvh;
  border: 1px solid #ccc;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#chatHeader {
  background: #4376DF;
  color: white;
  padding: 10px;
  font-size: 14px;
  font-weight: bold;
  display: flex;
  gap: 8px;
}

#chatHeader .backBtn {
  cursor: pointer;
  font-size: 18px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  background: #fafafa;
}

.msg {
  margin: 6px 0;
  padding: 10px 12px;
  border-radius: 10px;
  max-width: 95%;
  word-wrap: break-word;
  font-size: 14px;
  line-height: 1.6;
  text-align: left;
}

.user {
  background: #d1f0d1;
  align-self: flex-end;
}

.bot {
  background: #f0f0f0;
  align-self: flex-start;
}

#inputArea {
  display: flex;
  border-top: 1px solid #ddd;
  padding: 6px;
  gap: 6px;
}

#userInput {
  flex: 1;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
}

#micBtn,
#sendBtn {
  width: 44px;
  height: 44px;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: #0078d7;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#micBtn.recording {
  color: #ff5252;
  position: relative;
}

#micBtn.recording::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: 0 0 0 0 rgba(255,82,82,0.6);
  animation: micPulse 1.5s infinite;
  pointer-events: none;
}

@keyframes micPulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,82,82,0.6); }
  70%  { box-shadow: 0 0 0 10px rgba(255,82,82,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,82,82,0); }
}

@media screen and (max-width: 600px) {
  #chatbox {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: calc(100vw - 20px);
    max-width: calc(100vw - 20px);
  }
}
</style>
</head>

<body>


<div id="bg-layer">
  <header class="site-header">
    <h1>鹿嶋パークホテル</h1>
  </header>

  <main class="site-main">
    <h2>ご案内</h2>
    <p>チェックイン 15:00 / チェックアウト 10:00</p>
    <p>無料駐車場・館内Wi-Fi完備</p>

    <h2>アクセス</h2>
    <p>鹿島神宮駅より車で約10分</p>
  </main>

  <footer class="site-footer">
    © Kashima Park Hotel
  </footer>
</div>


<div id="chat-layer">

<div id="chatbox">
  <div id="chatHeader">
    <span class="backBtn" title="公式サイトへ戻る">◀</span>
    <div>
      矢印クリックで公式サイトへ..<br>
      鹿嶋パークホテルQ&Aチャットです<br>
      質問は直接入力、スマホ音声入力対応
    </div>
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input id="userInput" placeholder="">
    <button id="micBtn">🎤</button>
    <button id="sendBtn">送信</button>
  </div>
</div>

</div>

<script>


document.addEventListener("contextmenu", function(e){
  e.preventDefault();
});

document.addEventListener("selectstart", function(e){
  e.preventDefault();
});

document.addEventListener("keydown", function(e){
  if (
    (e.ctrlKey && ["c","u","s","p","a"].includes(e.key.toLowerCase())) ||
    e.key === "F12"
  ){
    e.preventDefault();
  }
});


document.addEventListener("touchstart", function(e){
  if(e.touches.length > 1){
    e.preventDefault();
  }
}, {passive:false});



document.querySelector(".backBtn").onclick = () => {
  window.location.href = "https://www.kashimaparkhotel.com/";
};

const faq = [
  {keywords:["チェックイン","ちぇっくいん","チェックイン時間","アーリーチェックイン","時間前に"], answer:"チェックインは15:00からとなります。アーリーチェックインは空室状況により有料で承っています。ご希望のお客様は、事前にホテル（TEL：0299-90-0500）までご連絡ください。"},
  {keywords:["チェックアウト","ちぇっくあうと","チェックアウト時間","レイトチェックアウト","延長"], answer:"チェックアウトは翌朝10:00までにお願いします。（※プランにより異なる場合があります。）レイトチェックアウトは空室状況により有料で承っています。"},
  {keywords:["早朝チェックアウト","深夜チェックイン","門限"], answer:"フロントスタッフが24時間在中していますので、深夜チェックインや早朝チェックアウトどちらも対応が可能です。"},
  {keywords:["荷物預かり","キャリーバック","数日間","チェックイン前","チェックアウト後"], answer:"チェックイン前は当日の朝から、チェックアウト後は当日のお引き取りに限り、お預かりが可能です。ただし数日後に再度ご予約をいただいている場合は、数日間のお預かりが可能です。※常温保存ができないものについてはお預かりできかねます。"},
  {keywords:["荷物受け取り","宅配物","荷物を送る"], answer:"宅配物のお受け取りは可能です。発送予定のお荷物には、必ず「チェックイン日」「宿泊者名（フルネーム）」をご記入ください。※着払い・クール便の宅配物はお受けできかねます。"},
  {keywords:["荷物発送","宅急便"], answer:"荷物の発送は、クロネコヤマト宅急便のみ発払い・着払いの対応が可能です。（支払方法：現金）※クール便、コンパクトなどはお受けできかねます。"},
  {keywords:["予約","予約方法","電話予約","料金","空室状況"], answer:"公式サイト、電話予約、または他社サイト（楽天トラベル、じゃらん等）にてご予約を承っています。空室状況や料金は、各社サイトまたはお電話（TEL：0299-90-0500）にてご確認ください。"},
  {keywords:["複数名予約","団体","団体予約","団体割引","団体割"], answer:"空室状況によりますが、公式サイトでは1回の予約につき、23名様まで可能です。（※団体割引はございません。）また4名様以上のご利用は、団体扱いとなりますので、事前にホテル（TEL:0299-90-0500）までご連絡ください。"},
  {keywords:["子供料金","添い寝","子ども料金","こども料金"], answer:"子ども料金の設定はありません。小学生以上のお子様は、大人と同じ扱いになります。また未就学児のお子様は、添い寝が可能です。"},
  {keywords:["部屋指定","角部屋","上層階","低層階","部屋希望"], answer:"お部屋のご希望につきましては、可能な限りお答えさせていただきますが、状況によりお受けできかねる場合があります。ご希望のお客様は、事前にホテル（TEL：0299-90-0500）までご連絡ください。"},
  {keywords:["キャンセル料","キャンセル","日程変更","予約変更"], answer:"公式サイト予約または電話予約のお客様は、当日15時までキャンセルは無料です。他社サイト（楽天トラベル、じゃらん等）予約のお客様は、各社サイトのキャンセルポリシーをご確認ください。また空室があれば、宿泊日程の変更は可能です。しかし部屋タイプ、プランの変更はできかねますので、ご予約のお取り直しをお願いします。ご不明な点がありましたら、ホテル（TEL：0299-90-0500）までご連絡ください。"},
  {keywords:["支払方法","現地支払","前振り込み","銀行振込"], answer:"当ホテルでは先払い制となり、現金またはクレジット決済のみ対応が可能です。またチェックイン当日までに銀行振込をご希望のお客様は、事前にホテル（TEL：0299-90-0500）までご連絡ください。※日程によっては、お受けできかねる場合がございます。"},
  {keywords:["領収書","宿泊証明書","レシート","発行","インボイス"], answer:"ホテルにてお支払いをいただいた場合、チェックアウトの際インボイス対応「領収書」をお渡しします。また他社サイト（楽天、じゃらん等）にて「事前決済」でご予約の場合は、各社サイトより発行をお願いします。※ホテルから領収書は発行できませんが、ご希望のお客様には「宿泊証明書」のお渡しが可能です。"},
  {keywords:["駐車場","車","バイク","二輪","自転車","大型","オートバイ","マイクロバス"], answer:"駐車場は、無料の第１～４駐車場があり、先着順です。大型車でお越しの際は、ホテル裏手のスーパーマーケット「カスミ」の第4駐車場をご利用ください。また二輪車でお越しの際は、ホテルご到着後、フロントまでお声掛けください。"},
  {keywords:["大浴場","温泉","ユニットバス","お風呂"], answer:"当ホテルでは、各客室のユニットバス以外に、西館2階にて大浴場をご用意しています。朝は6：00～9：00、夜は16：00～24：00までご入浴いただけます。また館内着、館内スリッパにてご利用いただけます。"},
  {keywords:["朝食","朝ごはん","朝食時間"], answer:"当ホテルでは、サービスで朝食をご用意しています。朝食は西館1階に会場があり、時間は朝6：30～8：45（最終入場）9：00までです。朝食会場では、館内着、館内スリッパでのご利用はご遠慮ください。※未就学児の朝食は別途料金をいただきます。"},
  {keywords:["洗濯機","乾燥機","ランドリー","自販機","自動販売機","電子レンジ","レンジ","製氷機"], answer:"東館4階、8階、西館2階に、ランドリー、自動販売機、電子レンジ（東館4階、8階のみ、西館各階）、製氷機（東館4階、西館2階のみ）、有料放送券売機があります。"},
  {keywords:["アメニティ","歯ブラシ","化粧品","カミソリ"], answer:"歯ブラシはお部屋のユニットバスにご用意しています。その他アメニティ（基礎化粧品、ブラシ、カミソリ、ボディスポンジ等）はフロントにご用意しています。"},
  {keywords:["貸し出し","貸し出し品","充電器","延長コード","ズボンプレッサー"], answer:"フロントにて、スマホ用充電器、延長コード、スタンドライト、アイロン、カサ、毛布、加湿器、電気ポット等の貸し出しが可能です。ズボンプレッサーは東館各階エレベーター横に、西館各階サービスコーナーにご用意があります。"},
  {keywords:["Wi-Fi","wi-fi","ワイファイ","わいふぁい","有線","LAN","lan"], answer:"全室無料のWi-Fi、有線LANのご利用が可能です。LANケーブルは、フロントにて貸し出しを行っています。"},
  {keywords:["喫煙所","喫煙場所","たばこ","喫煙","タバコ"], answer:"館内は喫煙部屋を除き、全て禁煙です。喫煙場所はホテル館外の西館非常階段脇にご用意しています。ご利用の際は、館内着、館内スリッパの着用はご遠慮ください。"},
  {keywords:["消臭対応","喫煙室","タバコの臭い"], answer:"喫煙室でご予約いただいた場合、できる限り消臭対応が可能です。（※完全に臭いが消えることはありません。）ご希望のお客様は、チェックイン当日12時までにホテル（TEL：0299-90-0500）までご連絡ください。12時以降対応はできかねますので、ご了承ください。"},
  {keywords:["アクセス","高速バス","東京駅"], answer:"東京駅八重洲南口 より『鹿島神宮駅行き』の高速バスへご乗車ください。（所要時間約1時間30分）「アートホテル鹿島セントラル」停留所で下車し、国道に向かって右手方向へ進んでください。通り沿いに300mほど直進しますと、ホテルに到着いたします。"},
  {keywords:["アクセス","車"], answer:"関東自動車道 潮来ICを降りて『銚子・鹿島港方面』へ進みます。10分ほど銚子方面へ直進しますと、進行方向右手に ホテルがあります。ホテルを通過後、次の交差点でUターンしてください。駐車場はホテル裏に隣接しております。"},
  {keywords:["コンビニ","一番近いコンビニ"], answer:"ホテル入口を出て左手に大通りがあります。右手に横断歩道があり、向かい側にセブンイレブンがあります。"},
  {keywords:["タクシー","タクシー予約"], answer:"タクシーは、タクシー会社の都合により、当日の朝にご予約をお取りすることが難しい場合があります。ご予約をご希望のお客様は、前日にフロントまでお声がけいただくことをお勧めしています。"}
];

function findAnswer(query){
  query = query.toLowerCase();
  for(const item of faq){
    for(const kw of item.keywords){
      if(query.includes(kw)) return item.answer;
    }
  }
  return "申し訳ありません。頂いた質問にはまだ対応していません。0299-90-0500までお問い合わせください。";
}

const messages = document.getElementById("messages");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

function addBotMessageTypewriter(text){
  const div = document.createElement("div");
  div.className = "msg bot";
  messages.appendChild(div);
  let i = 0;
  const timer = setInterval(()=>{
    div.textContent += text.charAt(i++);
    messages.scrollTop = messages.scrollHeight;
    if(i >= text.length) clearInterval(timer);
  }, 25);
}

function addMessage(msg, isUser=false){
  if(isUser){
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = msg;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }else{
    addBotMessageTypewriter(msg);
  }
}

sendBtn.onclick = () => {
  const msg = userInput.value.trim();
  if(!msg) return;
  addMessage(msg, true);
  setTimeout(()=>addMessage(findAnswer(msg)), 100);
  userInput.value = "";
};

userInput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    e.preventDefault();
    sendBtn.click();
  }
});

const placeholders = [
  "ご質問を入力ください",
  "音声入力はマイクをPush！",
  "チェックイン時の不明点や、",
  "駐車場、食事などお尋ねください",
  "お電話なら0299-90-0500まで.."
];
let phIndex = 0;
setInterval(()=>{
  userInput.placeholder = placeholders[phIndex];
  phIndex = (phIndex + 1) % placeholders.length;
}, 3000);

let recognition = null;
let isRecording = false;

if(window.SpeechRecognition || window.webkitSpeechRecognition){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "ja-JP";

  recognition.onstart = ()=>{
    isRecording = true;
    micBtn.classList.add("recording");
    micBtn.textContent = "●";
  };
  recognition.onend = recognition.onerror = ()=>{
    isRecording = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
  };
  recognition.onresult = e=>{
    userInput.value = e.results[0][0].transcript;
    sendBtn.click();
  };
}

function startVoice(){
  const ua = navigator.userAgent;

  if(ua.includes("Edg/")){
    alert("Edgeでは音声入力は利用できません。\nChrome または Safari をご利用ください。");
    return;
  }
  if(!recognition){
    alert("このブラウザでは音声入力に対応していません。");
    return;
  }
  if(isRecording) return;

  try{ recognition.start(); }catch(e){}
}

micBtn.onclick = startVoice;

micBtn.addEventListener("pointerdown", e=>{
  e.preventDefault();
  startVoice();
});

const AUTO_CLOSE_TIME = 180000;
let autoTimer = null;

function resetTimer(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(()=>{
    window.location.href = "https://www.kashimaparkhotel.com/";
  }, AUTO_CLOSE_TIME);
}

["click","keydown","mousemove","scroll","pointerdown"].forEach(ev=>{
  document.addEventListener(ev, resetTimer, { passive:true });
});
resetTimer();


</script>

</body>
</html>
